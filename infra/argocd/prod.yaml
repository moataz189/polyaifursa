apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/moataz189/polyaifursa.git
    targetRevision: main
    path: infra/k8s/prod
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    syncOptions:
      - CreateNamespace=true