apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/moataz189/polyaifursa.git
    targetRevision: dev
    path: infra/k8s/dev
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true