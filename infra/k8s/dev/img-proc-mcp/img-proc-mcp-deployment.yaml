apiVersion: apps/v1
kind: Deployment

metadata:
  name: img-proc-mcp
  namespace: dev
  labels:
    app: img-proc-mcp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: img-proc-mcp

  template:
    metadata:
      labels:
        app: img-proc-mcp

    spec:
      containers:
        - name: img-proc-mcp
          image: moataz189/img-proc-mcp:67afe7d565a539bbd34ddae31460084f33891115

          ports:
            - containerPort: 9000

          env:
            - name: AWS_REGION
              value: "us-east-1"

            - name: S3_BUCKET
              value: "moataz-polyai-images"

            - name: S3_PROCESSED_PREFIX
              value: "processed/"