apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: dev
data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: agent-dashboards
        orgId: 1
        folder: Agent
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards