apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agent-yolo-alerts
  namespace: monitoring
spec:
  groups:
    - name: agent.rules
      rules:
        - alert: AgentHighErrorRate
          expr: |
            100 *
            (
              sum(rate(agent_chat_requests_total{status="error"}[5m]))
              or vector(0)
            )
            /
            clamp_min(
              sum(rate(agent_chat_requests_total[5m])),
              0.000001
            )
            > 5
          for: 5m
          labels:
            severity: warning
            service: agent
          annotations:
            summary: "Agent /chat error rate above 5% ({{ $value | printf \"%.1f\" }}%)"
            description: "More than 5% of Agent /chat requests failed over the last 5 minutes, across all namespaces. Check agent pod logs and the Bedrock/S3 IAM grants."

        - alert: AgentCriticalErrorRate
          expr: |
            100 *
            (
              sum(rate(agent_chat_requests_total{status="error"}[5m]))
              or vector(0)
            )
            /
            clamp_min(
              sum(rate(agent_chat_requests_total[5m])),
              0.000001
            )
            > 25
          for: 5m
          labels:
            severity: critical
            service: agent
          annotations:
            summary: "Agent /chat error rate above 25% ({{ $value | printf \"%.1f\" }}%)"
            description: "More than a quarter of Agent /chat requests are failing -- likely a hard dependency outage (Bedrock, S3, or the agent pod itself), not transient errors."

        - alert: AgentPodNotReady
          # kube_pod_status_ready (from kube-state-metrics) reflects the
          # Pod's own Ready condition, unlike `up{job="agent-svc"}` which
          # only reflects whether Prometheus can reach the metrics port --
          # a pod can fail its readiness probe (and stop receiving traffic)
          # while its metrics endpoint keeps responding, so `up` alone
          # would miss this. `for: 1m` here is deliberately shorter than
          # the bundled default KubePodNotReady rule's 15m, so a stuck
          # agent pod pages faster than the generic cluster-wide rule.
          expr: kube_pod_status_ready{condition="false", pod=~"agent-.*"} == 1
          for: 1m
          labels:
            severity: warning
            service: agent
          annotations:
            summary: "Agent pod is not Ready"
            description: "An agent pod has failed its readiness probe for 1 minute -- traffic routed through agent-svc will not reach this pod. Check pod logs and events."

    - name: yolo.rules
      rules:
        - alert: YoloHighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket{job="yolo-svc"}[5m])) by (le)
            ) > 2
          for: 5m
          labels:
            severity: warning
            service: yolo
          annotations:
            summary: "YOLO p95 request latency above 2s"
            description: "95th percentile request latency for yolo-svc has exceeded 2 seconds for 5 minutes. Detection requests are slower than expected for interactive use."

        - alert: YoloDown
          expr: |
            up{job="yolo-svc"} == 0
            or absent(up{job="yolo-svc"})
          # Reduced from 2m to 1m for demo purposes, so the full
          # Pending -> Firing -> email -> RESOLVED chain can be demonstrated
          # more quickly. Every other rule's `for` is unchanged.
          #
          # The `absent()` arm matters because this target is discovered via
          # the Service's Endpoints: scaling the Deployment to 0 replicas
          # empties the Endpoints, so the `up{job="yolo-svc"}` series
          # disappears (stale marker) instead of reading 0 -- without
          # `absent()`, a fully-scaled-down yolo never fires this alert.
          for: 1m
          labels:
            severity: critical
            service: yolo
          annotations:
            summary: "YOLO target is down"
            description: "Prometheus has not been able to scrape yolo-svc for 1 minute -- the detection service is very likely fully unavailable, not just slow."
