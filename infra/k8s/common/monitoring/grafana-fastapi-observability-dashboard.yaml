# Source: https://grafana.com/grafana/dashboards/22676-fastapi-observability/
# Pinned to revision 4 (grafana.com/api/dashboards/22676/revisions/4/download),
# the latest revision as of 2026-08-03, fetched and committed here rather than
# provisioned live via kube-prometheus-stack's grafana.dashboards.<name>.gnetId
# value: that mechanism applies the upstream JSON verbatim at Grafana pod
# startup and cannot carry the namespace filtering added below (revision 4
# ships only a job/app_name variable, no namespace variable at all).
#
# Applies to any workload instrumented with prometheus_fastapi_instrumentator's
# default() metrics (http_requests_total, http_request_duration_seconds_*,
# process_resident_memory_bytes, process_cpu_seconds_total) -- currently only
# yolo-svc in this repo. The Agent's custom business metrics
# (agent_chat_requests_total, etc.) are a different metric surface, covered by
# the separate grafana-agent-dashboard.yaml, not by this dashboard.
#
# One panel ("Request time") queries fastapi_requests_in_progress{app_name=...},
# which is a naming mismatch in the upstream dashboard itself: prometheus_fastapi_
# instrumentator's in-progress gauge is disabled by default, and named
# http_requests_inprogress (not fastapi_requests_in_progress) when enabled. That
# one panel will show no data under a stock Instrumentator setup; left as-is to
# stay close to the upstream dashboard rather than silently dropping a panel.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-fastapi-observability-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "FastAPI"
